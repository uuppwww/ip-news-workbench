<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识产权·商标专利 主题资讯工作台</title>
<style>
  :root{
    --paper:#f6f4ef;
    --paper-2:#fffdf9;
    --ink:#20262e;
    --ink-soft:#4a525d;
    --muted:#8a8f98;
    --line:#e3ddd1;
    --line-strong:#d2c9b8;
    --accent:#9a3b2e;        /* muted cinnabar */
    --accent-soft:#c75c47;
    --slate:#33576f;
    --gold:#9c7a33;
    --shadow:0 1px 2px rgba(32,38,46,.06),0 6px 24px rgba(32,38,46,.05);
    --serif:"Songti SC","SimSun",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--slate);text-decoration:none;border-bottom:1px solid var(--line-strong);}
  a:hover{color:var(--accent);border-color:var(--accent);}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;background:rgba(246,244,239,.92);
    backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;padding:10px 22px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .company-bar{
    max-width:1180px;margin:0 auto;padding:8px 22px;
    font-size:12.5px;color:var(--slate);line-height:1.6;
    border-bottom:1px solid var(--line);background:rgba(246,244,239,.6);
  }
  .company-bar .co-name{font-weight:700;color:var(--ink);margin-right:14px;}
  .company-bar .co-sep{color:var(--line);margin:0 10px;}
  .company-bar .co-phone{color:var(--accent);}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;}
  .brand .mark{
    font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--accent);
  }
  .brand .sub{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
  .navlinks{display:flex;gap:4px;flex-wrap:wrap;}
  .navlinks a{
    font-size:13px;color:var(--ink-soft);border:none;padding:5px 10px;border-radius:6px;
  }
  .navlinks a:hover{background:#ece7db;color:var(--ink);}
  .btn-lang{
    font-family:var(--sans);font-size:13px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);
    padding:5px 12px;border-radius:6px;transition:.15s;
  }
  .btn-lang:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- Layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px 60px;}
  .meta-strip{
    display:flex;flex-wrap:wrap;gap:22px;padding:14px 2px 4px;color:var(--muted);font-size:12.5px;
  }
  .meta-strip span b{color:var(--ink-soft);font-weight:600;}

  /* ---------- Overview ---------- */
  .overview{padding:8px 0 4px;}
  .section-title{
    font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink);
    margin:30px 0 4px;display:flex;align-items:center;gap:10px;
  }
  .section-title::before{content:"";width:6px;height:22px;background:var(--accent);border-radius:2px;display:inline-block;}
  .section-sub{color:var(--muted);font-size:13px;margin:0 0 16px;}

  .lead{
    background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
    padding:18px 20px;box-shadow:var(--shadow);font-size:14.5px;color:var(--ink-soft);line-height:1.85;
  }
  .lead .drop{
    float:left;font-family:var(--serif);font-size:38px;line-height:1;color:var(--accent);
    margin:4px 12px 0 0;font-weight:700;
  }

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;}
  .stat{
    background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .stat::after{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--gold);opacity:.7;}
  .stat .num{font-family:var(--serif);font-size:25px;font-weight:700;color:var(--ink);line-height:1.2;}
  .stat .unit{font-size:13px;color:var(--ink-soft);margin-left:2px;}
  .stat .cap{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 6px;
    padding:12px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    cursor:pointer;font-size:13px;padding:6px 13px;border-radius:999px;border:1px solid var(--line-strong);
    background:#fff;color:var(--ink-soft);transition:.15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .search{
    margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line-strong);
    border-radius:999px;padding:5px 12px;min-width:220px;
  }
  .search input{border:none;outline:none;font-family:var(--sans);font-size:13.5px;width:100%;background:transparent;color:var(--ink);}
  .search svg{width:15px;height:15px;fill:var(--muted);flex:0 0 auto;}

  /* ---------- News list ---------- */
  .dim-block{margin-top:26px;scroll-margin-top:70px;}
  .dim-head{
    display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--ink);
    margin-bottom:6px;
  }
  .dim-head .tag{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink);}
  .dim-head .en{font-size:12px;color:var(--muted);letter-spacing:.5px;}
  .dim-head .cnt{margin-left:auto;font-size:12px;color:var(--muted);}
  .dim-bar{height:3px;background:var(--line);margin-top:-1px;}

  .item{
    display:grid;grid-template-columns:108px 1fr;gap:16px;padding:16px 8px;border-bottom:1px solid var(--line);
  }
  .item:hover{background:#fcfaf4;}
  .item .date{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--accent);line-height:1.3;}
  .item .date small{display:block;font-size:11px;color:var(--muted);font-weight:400;font-family:var(--sans);letter-spacing:.5px;}
  .item .body h3{margin:0 0 6px;font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.5;}
  .item .body p{margin:0 0 8px;font-size:14px;color:var(--ink-soft);line-height:1.8;}
  .item .meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .item .meta .src{color:var(--slate);}
  .item .meta .ext::after{content:"↗";font-size:11px;margin-left:2px;color:var(--muted);}

  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px;}

  /* ---------- Summary ---------- */
  .summary{
    margin-top:34px;background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--slate);
    border-radius:8px;padding:20px 22px;box-shadow:var(--shadow);
  }
  .summary p{margin:0 0 12px;font-size:14.5px;color:var(--ink-soft);line-height:1.9;}
  .summary p:last-child{margin-bottom:0;}
  .summary .k{color:var(--accent);font-weight:600;}

  /* ---------- Footer ---------- */
  footer{
    margin-top:44px;border-top:1px solid var(--line-strong);padding:22px 2px 10px;
    color:var(--muted);font-size:12.5px;line-height:1.8;
  }
  footer .disc{
    display:inline-block;background:#f0ece2;border:1px solid var(--line);border-radius:4px;
    padding:3px 10px;color:var(--ink-soft);font-size:12px;margin-bottom:10px;
  }
  footer a{color:var(--muted);border-color:var(--line);}

  .to-top{
    position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:18px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:40;
  }
  .to-top.show{opacity:1;pointer-events:auto;}
  .to-top:hover{background:var(--accent-soft);}

  @media(max-width:880px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .item{grid-template-columns:1fr;gap:4px;}
    .item .date{font-size:13px;}
    .item .date small{display:inline;margin-left:6px;}
    .search{margin-left:0;width:100%;}
  }
  @media print{
    .topbar,.toolbar,.to-top{display:none;}
    body{background:#fff;}
    .stat,.lead,.summary{box-shadow:none;}
  }

  /* 历史快照下拉 */
  .archive-sel{
    margin-left:14px;
    background:rgba(255,255,255,.12);
    color:#f4ece2;
    border:1px solid rgba(244,236,226,.28);
    border-radius:7px;
    padding:6px 10px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    max-width:180px;
  }
  .archive-sel:focus{outline:2px solid rgba(244,236,226,.5);}
  .archive-sel option{color:#1c1a17;background:#fbf7f0;}

  /* 历史快照查看器 */
  .archive-overlay{
    position:fixed;inset:0;z-index:60;background:#fbf7f0;display:none;
    flex-direction:column;
  }
  .archive-overlay.open{display:flex;}
  .archive-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;background:#241f1a;color:#f4ece2;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .archive-label{font-size:14px;letter-spacing:.04em;}
  .archive-close{
    background:transparent;border:1px solid rgba(244,236,226,.4);color:#f4ece2;
    width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:15px;line-height:1;
  }
  .archive-close:hover{background:rgba(244,236,226,.12);}
  .archive-frame{flex:1;border:0;width:100%;background:#fff;}
  .archive-body{flex:1;overflow:auto;background:#fff;}
  .archive-head{padding:18px 26px 6px;color:var(--muted);font-size:13px;}
  .archive-head b{color:var(--accent);}
</style>
</head>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark" data-i18n="brandMark">知产观察</span>
      <span class="sub" data-i18n="brandSub">IP & Trademark Intelligence</span>
    </div>

    <select class="archive-sel" id="archiveSel" title="历史快照">

    <button class="btn-lang" id="btnLang" data-i18n="langToggle">EN</button>
  </div>
</header>

<div class="company-bar" id="companyBar"></div>

<div class="archive-overlay" id="archiveOverlay">

</div>

<main class="wrap">

  <div class="meta-strip" id="metaStrip"></div>

  <!-- Overview -->
  <section class="overview">
    <h2 class="section-title" data-i18n="overviewTitle">主题概览</h2>
    <p class="section-sub" data-i18n="overviewSub"></p>
    <div class="lead" id="lead"></div>
    <div class="stats" id="stats"></div>
  </section>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="chips" id="chips"></div>

      <input id="searchInput" type="text" data-i18n-ph="searchPlaceholder">
    </div>
  </div>

  <!-- News -->
  <div id="newsRoot"></div>

  <!-- Summary -->
  <section class="summary">
    <h2 class="section-title" data-i18n="summaryTitle">资讯脉络小结</h2>
    <div id="summaryBody"></div>
  </section>

  <footer>
    <span class="disc" data-i18n="footerDisc">本内容仅为资讯整理</span>
    <div id="footerBody"></div>
  </footer>
</main>

<button class="to-top" id="toTop" title="↑">↑</button>

const ARCHIVE = [];   // 兼容占位（历史视图改为前端实时渲染）

/* ============================================================
   渲染逻辑
   ============================================================ */
const DIMS = ["dynamic","hot","fund","policy"];
const STATS = [
  {key:"statPatent",num:"631.8",unitKey:"statPatentUnit",capKey:"statPatentCap"},
  {key:"statTrademark",num:"5303.2",unitKey:"statTrademarkUnit",capKey:"statTrademarkCap"},
  {key:"statPCT",num:"7.37",unitKey:"statPCTUnit",capKey:"statPCTCap"},
  {key:"statOversea",num:"2053",unitKey:"statOverseaUnit",capKey:"statOverseaCap"},
  {key:"statPledge",num:"6000",unitKey:"statPledgeUnit",capKey:"statPledgeCap"},
  {key:"statService",num:"2940",unitKey:"statServiceUnit",capKey:"statServiceCap"}
];

let LANG = (new URLSearchParams(location.search).get("lang")==="en") ? "en" : "zh";
let ACTIVE_DIM = "all";
let QUERY = "";

function t(k){return (DICT[LANG]&&DICT[LANG][k]!=null)?DICT[LANG][k]:(DICT.zh[k]||k);}
function dItem(it,f){return it[f+LANG.charAt(0).toUpperCase()+LANG.slice(1)];}
function field(it,base){ // base: 'title'|'sum'|'src' -> returns zh/en, EN falls back to ZH if empty
  if(LANG!=="en") return it[base+"Zh"];
  const en=it[base+"En"];
  return (en&&String(en).trim())?en:it[base+"Zh"];
}
function esc(s){return s;} // content is trusted, internal

function applyStaticText(){
  document.documentElement.lang = (LANG==="en")?"en":"zh";
  document.title = (LANG==="en"?"IP & Trademark Intelligence Workbench":"知识产权·商标专利 主题资讯工作台");
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    if(k==="langToggle") return; // handled separately
    el.innerHTML = t(k);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.getAttribute("data-i18n-ph"));});
  document.getElementById("btnLang").textContent = t("langToggle");
  const cb=document.getElementById("companyBar");
  if(cb) cb.innerHTML = t("companyLine");
  document.getElementById("lead").innerHTML = t("lead");
  document.getElementById("summaryBody").innerHTML = t("summaryText").map(p=>"<p>"+p+"</p>").join("");
  // footer
  document.getElementById("footerBody").innerHTML =
    "<div>"+t("footerSource")+"</div><div style='margin-top:6px'>"+t("footerNote")+"</div>";
  // meta strip
  const today = new Date().toISOString().slice(0,10);
  document.getElementById("metaStrip").innerHTML =
    "<span><b>"+t("footerSource").split("：")[0].split(":")[0]+"</b> · "+t("dimDynamic")+" / "+t("dimHot")+" / "+t("dimFund")+" / "+t("dimPolicy")+"</span>"+
    "<span><b>"+t("dateLabel")+"</b> "+today+"</span>"+
    "<span><b>"+t("itemsLabel")+"</b> "+ITEMS.length+"</span>";
}

function buildNav(){
  const nav=document.getElementById("navlinks");
  const links=[{k:"all",label:t("navAll")}].concat(DIMS.map(d=>({k:d,label:t("dim"+d.charAt(0).toUpperCase()+d.slice(1))})));
  nav.innerHTML = links.map(l=>'<a href="#dim-'+(l.k==="all"?"top":l.k)+'" data-nav="'+l.k+'">'+l.label+'</a>').join("");
}

function buildChips(){
  const chips=document.getElementById("chips");
  const all=[{k:"all",label:t("navAll")}].concat(DIMS.map(d=>({k:d,label:t("dim"+d.charAt(0).toUpperCase()+d.slice(1))})));
  chips.innerHTML = all.map(c=>'<span class="chip'+(ACTIVE_DIM===c.k?" active":"")+'" data-chip="'+c.k+'">'+c.label+'</span>').join("");
  chips.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick=()=>{ACTIVE_DIM=ch.getAttribute("data-chip");buildChips();renderNews();};
  });
}

function buildStats(){
  document.getElementById("stats").innerHTML = STATS.map(s=>{
    const cap = (LANG==="en")?t(s.capKey):t(s.capKey);
    return '<div class="stat"><div class="num">'+s.num+'<span class="unit">'+t(s.unitKey)+'</span></div><div class="cap">'+t(s.key)+'<br>'+cap+'</div></div>';
  }).join("");
}

function filtered(){
  let list = ITEMS.slice();
  if(ACTIVE_DIM!=="all") list = list.filter(it=>it.dim===ACTIVE_DIM);
  if(QUERY){
    const q=QUERY.toLowerCase();
    list = list.filter(it=>(it.titleZh+it.titleEn+it.sumZh+it.sumEn+it.srcZh+it.srcEn).toLowerCase().includes(q));
  }
  list.sort((a,b)=> b.date.localeCompare(a.date));
  return list;
}

function renderNews(){
  const root=document.getElementById("newsRoot");
  const list=filtered();
  if(!list.length){root.innerHTML='<div class="empty">'+t("noResult")+'</div>';return;}
  let html="";
  if(ACTIVE_DIM==="all"){
    DIMS.forEach(d=>{
      const sub=list.filter(it=>it.dim===d);
      if(!sub.length) return;
      html+=dimBlock(d,sub);
    });
  }else{
    html+=dimBlock(ACTIVE_DIM,list);
  }
  root.innerHTML=html;
}

function dimBlock(d,items){
  const id = (d==="all")?"top":d;
  let h='<div class="dim-block" id="dim-'+id+'">';
  h+='<div class="dim-head"><span class="tag">'+t("dim"+d.charAt(0).toUpperCase()+d.slice(1))+'</span>'+
      '<span class="en">'+t("dim"+d.charAt(0).toUpperCase()+d.slice(1)+"En")+'</span>'+
      '<span class="cnt">'+items.length+' '+t("itemsLabel")+'</span></div>';
  h+='<div class="dim-bar"></div>';
  items.forEach(it=>{
    h+='<article class="item">'+
        '<div class="date">'+it.date+'<small>'+t("dateLabel")+'</small></div>'+
        '<div class="body"><h3>'+field(it,"title")+'</h3>'+
        '<p>'+field(it,"sum")+'</p>'+
        '<div class="meta"><span class="src">'+t("sourceLabel")+'：'+field(it,"src")+'</span>'+
        '<a class="ext" href="'+it.url+'" target="_blank" rel="noopener">'+it.url.replace(/^https?:\/\//,'').split('/')[0]+'</a></div>'+
        '</div></article>';
  });
  h+='</div>';
  return h;
}

function renderAll(){
  applyStaticText();
  buildNav();
  buildChips();
  buildStats();
  renderNews();
  initArchive();
}

/* 历史快照：填充日期下拉 + 前端渲染「截至该日的真实汇总」 */
let _archiveBound=false;
function initArchive(){
  const sel=document.getElementById("archiveSel"); if(!sel) return;
  sel.innerHTML='<option value="">'+t("archiveTitle")+'</option>';
  (HISTORY_DATES||[]).forEach(d=>{
    const o=document.createElement("option");
    o.value=d;
    o.textContent=d;
    sel.appendChild(o);
  });
  if(!_archiveBound){
    sel.addEventListener("change",onArchiveChange);
    document.getElementById("archiveClose").addEventListener("click",()=>{
      document.getElementById("archiveOverlay").classList.remove("open");
      document.getElementById("archiveBody").innerHTML="";
      sel.value="";
    });
    _archiveBound=true;
  }
}
function onArchiveChange(){
  const sel=this;
  const d=sel.value;
  const overlay=document.getElementById("archiveOverlay");
  const body=document.getElementById("archiveBody");
  const label=document.getElementById("archiveLabel");
  if(!d){ overlay.classList.remove("open"); body.innerHTML=""; return; }
  label.textContent=t("archiveTitle")+": "+d;
  // 截至所选日期的真实资讯（date <= d），按日期倒序
  const list=ITEMS.filter(it=>it.date<=d).sort((a,b)=>b.date.localeCompare(a.date));
  let html='<div class="archive-head">'+t("archiveHead").replace("{d}",d).replace("{n}",list.length)+'</div>';
  if(!list.length){ html+='<div class="empty">'+t("noResult")+'</div>'; }
  else {
    DIMS.forEach(dim=>{
      const sub=list.filter(it=>it.dim===dim);
      if(!sub.length) return;
      html+=dimBlock(dim,sub);
    });
  }
  body.innerHTML=html;
  overlay.classList.add("open");
}

/* language toggle */
document.getElementById("btnLang").addEventListener("click",()=>{
  LANG = (LANG==="zh")?"en":"zh";
  const params=new URLSearchParams(location.search);
  if(LANG==="en") params.set("lang","en"); else params.delete("lang");
  const newUrl = location.pathname + (params.toString()?"?"+params.toString():"") + location.hash;
  history.replaceState(null,"",newUrl);
  renderAll();
});

/* search */
document.getElementById("searchInput").addEventListener("input",e=>{QUERY=e.target.value.trim();renderNews();});

/* back to top */
const toTop=document.getElementById("toTop");
window.addEventListener("scroll",()=>{toTop.classList.toggle("show",window.scrollY>500);});
toTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

/* go */
renderAll();
</script>
